services:
  backend:
    build: ./Backend
    env_file: ./Backend/.env
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: http://localhost:8080
      INSIGHTS_DB_PATH: /app/state/insights.db
    volumes:
      # Policy documents live on the host; uploads from the admin UI are written here.
      # Changes are picked up automatically (no restart needed).
      - ./Backend/data/policies:/app/data/policies
      # Persists HR insights (unanswered questions, feedback) across deploys.
      - backend-state:/app/state
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-state:
